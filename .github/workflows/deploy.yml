name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Custom domain mqcity.app (Beta 1.0.4) — site is now served from
      # the apex of the custom domain so `--base=/` is correct. The
      # `public/CNAME` file tells GitHub Pages which custom domain to
      # serve. Forks without a custom domain that want to deploy at the
      # repo subpath should remove the CNAME file AND change this back
      # to `--base=/${{ github.event.repository.name }}/`.
      #
      # Supabase env vars (Alpha 4.25) — Vite inlines `VITE_*` at build
      # time. Set these in repo Settings → Secrets and variables → Actions.
      # If unset, the deployed build runs in local-only mode (no auth
      # modal, no cloud saves) and everything still works. See
      # docs/CLOUD_SETUP.md for the 10-minute Supabase setup.
      - run: npm run build -- --base=/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Discord Activities integration (Beta 1.6.2). Optional —
          # set this when you want the same build to also be
          # launchable from Discord's Activities Shelf. Unset = the
          # iframe-detection path stays inert; standalone mqcity.app
          # is byte-equivalent to pre-1.6.2. See docs/DISCORD_SETUP.md
          # for how to obtain this value (Discord Developer Portal →
          # Applications → MQ City Builder → Application ID).
          VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
