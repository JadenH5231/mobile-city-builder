<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Mayor's Mansion app icon (Alpha 4.7). Reads as the 4×2 showpiece:
    central 3-storey block with copper-green dome + spire + gold ball
    finial, side wings with slate hipped roofs, columned portico,
    triangular pediment with gold escutcheon, lawn grounds with
    perimeter wall + gate posts. Same palette as the in-game mansion
    geometry — cream limestone walls, slate roofs, copper-green dome,
    gold accents. Stays on-brand at 192×192 down to 48×48.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d96d4"/>
      <stop offset="0.7" stop-color="#a4caea"/>
      <stop offset="1" stop-color="#e6d8be"/>
    </linearGradient>
  </defs>
  <!-- Background: warm sky -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- Estate lawn at the bottom -->
  <rect x="0" y="368" width="512" height="144" fill="#4a8c3a"/>
  <!-- Driveway approach -->
  <rect x="232" y="430" width="48" height="82" fill="#c7c0ad"/>
  <!-- Perimeter wall + gate posts -->
  <rect x="48"  y="430" width="180" height="14" fill="#eae0c8"/>
  <rect x="284" y="430" width="180" height="14" fill="#eae0c8"/>
  <rect x="220" y="416" width="14"  height="34" fill="#eae0c8"/>
  <rect x="278" y="416" width="14"  height="34" fill="#eae0c8"/>
  <polygon points="227,408 220,416 234,416" fill="#eec453"/>
  <polygon points="285,408 278,416 292,416" fill="#eec453"/>

  <!-- Mansion body -->
  <!-- Outer wings (left + right) — 2-storey, slate hipped roof -->
  <rect x="56"  y="248" width="100" height="124" fill="#eae0c8"/>
  <polygon points="50,248 162,248 130,206 82,206" fill="#4a5060"/>
  <rect x="356" y="248" width="100" height="124" fill="#eae0c8"/>
  <polygon points="350,248 462,248 430,206 382,206" fill="#4a5060"/>
  <!-- Inner blocks — slightly taller -->
  <rect x="148" y="220" width="68"  height="152" fill="#eae0c8"/>
  <polygon points="143,220 221,220 200,188 164,188" fill="#4a5060"/>
  <rect x="296" y="220" width="68"  height="152" fill="#eae0c8"/>
  <polygon points="291,220 369,220 348,188 312,188" fill="#4a5060"/>
  <!-- Cornice band running across mansion -->
  <rect x="48" y="302" width="416" height="8" fill="#d4c8a8"/>

  <!-- Central block — 3-storey + parapet + dome + portico -->
  <rect x="208" y="180" width="96"  height="192" fill="#eae0c8"/>
  <rect x="200" y="174" width="112" height="14"  fill="#d4c8a8"/>
  <!-- Pediment triangle above entrance -->
  <polygon points="200,174 312,174 256,116" fill="#3a3e4a"/>
  <!-- Gold escutcheon in pediment -->
  <rect x="244" y="138" width="24" height="20" fill="#eec453"/>
  <!-- Columns of portico -->
  <rect x="216" y="248" width="12" height="124" fill="#eae0c8"/>
  <rect x="240" y="248" width="12" height="124" fill="#eae0c8"/>
  <rect x="260" y="248" width="12" height="124" fill="#eae0c8"/>
  <rect x="284" y="248" width="12" height="124" fill="#eae0c8"/>
  <!-- Grand arched door -->
  <rect x="240" y="296" width="32" height="76" fill="#3a2010" rx="14"/>
  <!-- Cornice between stories -->
  <rect x="200" y="240" width="112" height="8" fill="#d4c8a8"/>
  <rect x="200" y="208" width="112" height="8" fill="#d4c8a8"/>

  <!-- Dome on top of central block -->
  <!-- Drum -->
  <rect x="226" y="100" width="60" height="20" fill="#eae0c8"/>
  <!-- Dome (copper-green) — half-ellipse via path -->
  <path d="M 226 100 A 30 26 0 0 1 286 100 Z" fill="#4f9f7a"/>
  <!-- Cupola lantern -->
  <rect x="246" y="58" width="20" height="22" fill="#eae0c8"/>
  <polygon points="240,58 272,58 256,40" fill="#4f9f7a"/>
  <!-- Spire + gold ball finial -->
  <rect x="254" y="22" width="4" height="20" fill="#c4c0b6"/>
  <circle cx="256" cy="14" r="8" fill="#eec453"/>
</svg>
